name: Sync Taiwan Market Cache

on:
  schedule:
    # 18:10 Asia/Taipei = 10:10 UTC
    - cron: "10 10 * * *"
  workflow_dispatch:

jobs:
  sync-taiwan-market-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync TWSE and TPEx cache to Worker R2
        env:
          MARKET_SYNC_SECRET: ${{ secrets.MARKET_SYNC_SECRET }}
          CHICHANG_MARKET_IMPORT_URL: https://chichangstockapp.com/api/market/cache/import
        run: python scripts/sync_taiwan_market_cache.py

      - name: Sync Taiwan weighted index cache to Worker R2
        env:
          MARKET_SYNC_SECRET: ${{ secrets.MARKET_SYNC_SECRET }}
        run: |
          curl --fail-with-body --retry 3 --request POST \
            --header "Authorization: Bearer ${MARKET_SYNC_SECRET}" \
            "https://chichangstockapp.com/api/market/index/sync?index=taiwanWeighted"
